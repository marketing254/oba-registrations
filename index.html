<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | OBA Academy</title>
  <meta name="description" content="Our new website is on its way. Stay tuned!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 640px;
    }

    .badge {
      display: inline-block;
      padding: 8px 20px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    h1 span {
      background: linear-gradient(90deg, #ffd86f, #fc6262);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 36px;
    }

    .divider {
      width: 64px;
      height: 3px;
      background: linear-gradient(90deg, #ffd86f, #fc6262);
      border-radius: 2px;
      margin: 0 auto 36px;
    }

    .contact a {
      color: #ffd86f;
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 48px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">Coming Soon</div>
    <h1>Something great is <span>on the way</span></h1>
    <div class="divider"></div>
    <p>
      We're working hard behind the scenes to bring you our new website.
      Registrations and updates will be available here very soon — stay tuned!
    </p>
    <p class="contact">
      Questions? Reach us at <a href="mailto:info@example.com">info@example.com</a>
    </p>
    <footer>&copy; 2026 OBA Academy. All rights reserved.</footer>
  </main>
</body>
</html>
